[env:pico32]
platform = espressif32
board = pico32
framework = arduino
monitor_speed = 115200
build_src_filter = 
    -<test>
lib_deps = 
    Adafruit SSD1306
    sparkfun/SparkFun VL53L5CX Arduino Library@^1.0.3

[env:test_arm]
platform = espressif32
board = pico32
framework = arduino
monitor_speed = 115200
build_src_filter = 
    +<actuators/Arm.cpp>
    +<actuators/Servo.cpp>
    +<actuators/BaseGear.cpp>
    +<sensors/MagneticEncoder.cpp>
    +<test/arm>
lib_deps = 
    Adafruit SSD1306

